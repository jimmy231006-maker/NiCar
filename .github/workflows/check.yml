name: Verificar NiCar
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: NiCarWeb
      - run: npm test
        working-directory: NiCarWeb
      - run: find servidor publico/scripts -name '*.js' -exec node --check {} \;
        working-directory: NiCarWeb
