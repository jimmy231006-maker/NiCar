services:
  - type: web
    name: nicar
    runtime: node
    plan: free
    rootDir: NiCarWeb
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_SSL_CERT
        sync: false
